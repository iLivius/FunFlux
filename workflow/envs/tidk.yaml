# The exact package builds of this environment are fixed by tidk.linux-64.pin.txt next to this
# file; Snakemake creates the environment from that list. tidk and its libraries keep the builds
# of the tested environment. Python is here because rule telomere_units
# (workflow/rules/shared/25_contig_summary.smk) runs telomere_units.py and tidk in one
# environment: the script calls tidk, so both must be on the job's PATH, and `python` is then
# this environment's Python instead of whatever `python` the computer has (a server with only
# `python3` would stop the job). The list was made on 2026-10-10 (conda 26.7.2) with
#   CONDA_ADD_PIP_AS_PYTHON_DEPENDENCY=false conda create -p <env> --override-channels \
#       -c conda-forge -c bioconda tidk=0.3.0 python=3.12
# and then conda list -p <env> --explicit wrote the list. The setting leaves out pip, which
# conda otherwise adds to Python and nothing here uses; --override-channels makes conda use only
# the two channels named after it, whatever the computer's conda settings list.
name: tidk
channels:
  - conda-forge
  - bioconda
dependencies:
  - tidk=0.3.0
  - python=3.12
