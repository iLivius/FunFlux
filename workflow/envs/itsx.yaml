# The exact package builds of this environment are fixed by itsx.linux-64.pin.txt next to this
# file; Snakemake creates the environment from that list. ITSx, HMMER and their libraries keep the
# builds of the tested environment. Python was added on 2026-10-08 (conda 26.7.2): in an
# environment made from the earlier list (conda create -p <env> --file <earlier list>), the command
#   CONDA_ADD_PIP_AS_PYTHON_DEPENDENCY=false conda install -p <env> --override-channels \
#       -c conda-forge -c bioconda --freeze-installed python=3.12
# added Python and the libraries it needs and changed no other build. The setting leaves out pip,
# which conda otherwise adds to Python and nothing here uses; --override-channels makes conda use
# only the two channels named after it, whatever the computer's conda settings list. Then
# conda list -p <env> --explicit wrote the list.
# Python is here for rule its_windows (workflow/rules/shared/30_taxonomy.smk), which runs the
# script its_windows.py with `python`: the job then uses this environment's own Python instead of
# whatever `python` the server has (a server with only `python3` would stop the job).
name: itsx
channels:
  - conda-forge
  - bioconda
dependencies:
  - itsx=1.1.3
  - python=3.12
